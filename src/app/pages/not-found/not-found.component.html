<section class="not-found-page">

  <!-- خلفيات الإضاءة النيونية والتأثيرات الهندسية -->
  <div class="bg-glow bg-glow-one"></div>
  <div class="bg-glow bg-glow-two"></div>
  <div class="grid-overlay"></div>

  <div class="not-found-card">

    <!-- رقم 404 عملاق وشفاف في خلفية الكارت -->
    <div class="watermark-404">404</div>

   

    <span class="eyebrow">
      <span class="pulse-dot"></span>
      ERROR 404 • PAGE NOT FOUND
    </span>

    <h1>
      Lost in <span>Space?</span>
    </h1>

    <p>
      The employee profile or page you are searching for has been moved, deleted, or never existed in this dimension.
    </p>

    <button
      type="button"
      class="back-button"
      (click)="goToEmployees()"
    >
      <span class="btn-arrow">←</span>
      <span>Return to Safety</span>
    </button>

  </div>

</section>
